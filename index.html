<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08132b">
  <meta name="description" content="Explore the Stamford University Bangladesh campus and the portal hidden beneath its swimming pool.">
  <title>Stamford Campus Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308132b'/%3E%3Cpath d='M6 13 16 7l10 6H6Zm3 3v9m7-9v9m7-9v9M6 25h20' fill='none' stroke='%23a9d3ff' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="campus" data-active="false" data-ready="false">
  <canvas id="world" aria-label="Interactive 3D campus" tabindex="-1"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="hud">
    <div class="location">
      <span id="zone-code" class="eyebrow"><i class="signal"></i><span>ZONE A</span></span>
      <strong id="zone-name">Main Gate &amp; Front Garden</strong>
    </div>
    <div class="reticle" aria-hidden="true"></div>

    <section class="briefing" aria-label="Campus introduction">
      <div class="hero-backdrop" aria-hidden="true"></div>
      <h1 class="hero-title">Stamford <span>Campus</span></h1>
      <canvas class="hero-art" id="campus-hero" width="1400" height="840" role="img" aria-label="The campus CSE building, with its brick lattice façade and Stamford University sign"></canvas>
      <p class="intro-copy">Explore the campus in 3D, from the front garden to the portal beneath the swimming pool.</p>
      <div class="briefing-controls">
        <button class="primary" id="start" type="button" disabled>
          <span>Enter campus</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4"/></svg>
        </button>
        <p class="load-state" id="load-state" role="status">Building the campus scene…</p>
        <noscript><p class="load-state">Enable JavaScript to explore the campus.</p></noscript>
      </div>
    </section>

    <aside class="instrument campus-instrument" aria-label="Campus map and coordinates" hidden>
      <div class="instrument-top"><span><i class="signal"></i> Campus map</span><span>↑ N</span></div>
      <svg id="minimap" class="minimap" role="img" aria-label="Campus map with your position and four stops"></svg>
      <div class="telemetry">
        <span><b>X</b> <output id="coord-x">—</output></span>
        <span><b>Y</b> <output id="coord-y">—</output></span>
        <span><b>Z</b> <output id="coord-z">—</output></span>
      </div>
      <div class="instrument-bottom"><span>Heading</span><span id="bearing">N · 000°</span></div>
    </aside>

    <div class="bottom-hud">
      <div class="checkpoints" role="group" aria-label="Teleport to a campus checkpoint">
        <button type="button" data-action="Digit1" aria-current="location" disabled><kbd>1</kbd><span>Gate &amp; garden</span></button>
        <button type="button" data-action="Digit2" disabled><kbd>2</kbd><span>CSE &amp; libraries</span></button>
        <button type="button" data-action="Digit3" disabled><kbd>3</kbd><span>Central ground</span></button>
        <button type="button" data-action="Digit4" disabled><kbd>4</kbd><span>Swimming pool</span></button>
      </div>
      <div class="scene-actions" role="group" aria-label="Campus actions">
        <button type="button" class="scene-action" data-action="KeyE" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M3 8h14M8 8v9"/></svg>
          Layout editor
        </button>
        <button type="button" class="scene-action" data-action="KeyP" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M7 10h6m-3-3 3 3-3 3"/></svg>
          Deep sea
        </button>
      </div>
    </div>
    <div class="touch-drive" role="group" aria-label="On-screen movement">
      <button type="button" data-move="KeyW" aria-label="Walk forward">↑</button>
      <button type="button" data-move="KeyA" aria-label="Walk left">←</button>
      <button type="button" data-move="KeyS" aria-label="Walk back">↓</button>
      <button type="button" data-move="KeyD" aria-label="Walk right">→</button>
    </div>
    <button type="button" id="pause" class="pause-button" aria-label="Pause exploration">Ⅱ</button>
    <div class="notice" id="notice" role="status" hidden></div>

    <section id="layout-editor" class="layout-editor" hidden aria-labelledby="editor-title">
      <div class="editor-header">
        <h2 id="editor-title">Campus layout</h2>
        <button type="button" id="editor-close" class="editor-close">Exit <kbd>E</kbd></button>
      </div>
      <div class="editor-palette" role="group" aria-label="Place an item">
        <button type="button" draggable="true" data-place="tree" aria-pressed="false">+ Tree</button>
        <button type="button" draggable="true" data-place="door" aria-pressed="false">+ Door</button>
        <button type="button" draggable="true" data-place="building" aria-pressed="false">+ Building</button>
      </div>
      <p id="editor-placement" class="editor-placement" role="status" hidden></p>
      <label class="editor-picker">Object
        <select id="editor-object"><option value="">Select an object</option></select>
      </label>
      <div class="editor-view-tools">
        <button type="button" id="editor-focus" disabled>Frame selection</button>
        <button type="button" id="editor-fit">Fit campus</button>
        <button type="button" id="editor-tilt">Tilt view</button>
      </div>
      <div class="editor-modes" role="group" aria-label="Transform tool">
        <button type="button" data-editor-mode="translate" aria-pressed="true" disabled>Move <kbd>G</kbd></button>
        <button type="button" data-editor-mode="rotate" aria-pressed="false" disabled>Rotate <kbd>R</kbd></button>
        <button type="button" data-editor-mode="scale" aria-pressed="false" disabled>Scale <kbd>S</kbd></button>
      </div>
      <fieldset id="editor-fields" disabled>
        <legend>Transform</legend>
        <div class="editor-values">
          <label>X (m)<input data-transform="position.x" type="number" step="any"></label>
          <label>Z (m)<input data-transform="position.z" type="number" step="any"></label>
          <label>Yaw (°)<input data-transform="yaw" type="number" step="any"></label>
          <label><span data-size-label="x">Width (%)</span><input data-transform="scale.x" type="number" step="any"></label>
          <label><span data-size-label="z">Depth (%)</span><input data-transform="scale.z" type="number" step="any"></label>
          <label><span data-size-label="y">Height (%)</span><input data-transform="scale.y" type="number" step="any"></label>
          <label id="editor-elevation" hidden>Y (m)<input data-transform="position.y" type="number" step="any"></label>
          <label id="editor-door-offset" hidden>Along wall (m)<input data-transform="door" type="number" step="any"></label>
        </div>
        <output id="editor-size-detail" class="editor-size-detail" hidden></output>
      </fieldset>
      <div class="editor-actions">
        <button type="button" id="editor-download-json" class="editor-export">Export JSON</button>
        <button type="button" id="editor-copy-json">Copy JSON</button>
      </div>
      <div id="editor-feedback" class="editor-feedback" role="status"></div>
    </section>
  </main>

  <div class="transition" aria-hidden="true"><strong>Crossing the portal</strong></div>
  <script type="module">
    import('./src/mainCampus.js').then(({ startCampus }) => startCampus()).catch((error) => {
      console.error(error);
      document.getElementById('load-state').textContent = error.message.startsWith('WebGL')
        ? error.message : 'Campus could not load. Open this page from a local HTTP server and check the Three.js CDN connection.';
    });
  </script>
</body>
</html>
