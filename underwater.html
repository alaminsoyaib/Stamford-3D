<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07142d">
  <meta name="description" content="Follow the underwater portal from a sunlit reef to a bioluminescent abyss.">
  <title>Deep Sea · Stamford Campus Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307142d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%239fe9ff' stroke-width='1.5'/%3E%3Cpath d='M5 17q6-6 12 0t10-1' fill='none' stroke='%239fe9ff' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="ocean" data-active="false" data-ready="false">
  <canvas id="world" aria-label="Interactive 3D underwater environment" tabindex="-1"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="hud">
    <div class="location">
      <span id="zone-code" class="eyebrow"><i class="signal"></i><span>LAYER 01</span></span>
      <strong id="zone-name">Sunlit Reef</strong>
    </div>
    <div class="reticle" aria-hidden="true"></div>

    <section class="briefing" aria-label="Underwater introduction">
      <div class="hero-backdrop" aria-hidden="true"></div>
      <h1 class="hero-title">Into the <span>Deep</span></h1>
      <img class="hero-art" src="./assets/ocean-diorama.webp" width="1200" height="722" alt="" fetchpriority="high">
      <p class="intro-copy">Dive from a sunlit reef to the bioluminescent seafloor, 120 metres below the surface.</p>
      <div class="briefing-controls">
        <button class="primary" id="start" type="button" disabled>
          <span>Begin descent</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v11m-4-4 4 4 4-4"/></svg>
        </button>
        <p class="load-state" id="load-state" role="status">Building the ocean scene…</p>
        <noscript><p class="load-state">Enable JavaScript to begin the descent.</p></noscript>
      </div>
    </section>

    <aside class="instrument ocean-instrument" aria-label="Depth and coordinates" hidden>
      <div class="instrument-top"><span><i class="signal"></i> Depth</span><span>↓</span></div>
      <div class="depth-readout"><output id="depth-value">0.0</output><span>m</span></div>
      <div class="depth-chart">
        <div id="depth-scale" class="depth-scale" role="meter" aria-label="Depth" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0">
          <div class="depth-marker" id="depth-marker"></div>
        </div>
        <div class="depth-labels" aria-hidden="true">
          <span>0</span><span>120 m</span>
        </div>
      </div>
      <div class="telemetry">
        <span><b>X</b> <output id="coord-x">—</output></span>
        <span><b>Y</b> <output id="coord-y">—</output></span>
        <span><b>Z</b> <output id="coord-z">—</output></span>
      </div>
    </aside>

    <div class="bottom-hud">
      <div class="scene-actions">
        <a class="scene-action" id="campus-link" href="./index.html?arrival=pool">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H5m4-4-4 4 4 4"/></svg>
          Return to campus
        </a>
      </div>
    </div>
    <div class="touch-drive" role="group" aria-label="On-screen movement">
      <button type="button" data-move="KeyW" aria-label="Swim forward">↑</button>
      <button type="button" data-move="KeyA" aria-label="Swim left">←</button>
      <button type="button" data-move="KeyS" aria-label="Swim back">↓</button>
      <button type="button" data-move="KeyD" aria-label="Swim right">→</button>
      <button class="rise" type="button" data-move="Space" aria-label="Ascend">Rise</button>
      <button class="sink" type="button" data-move="KeyC" aria-label="Descend">Sink</button>
    </div>
    <button type="button" id="pause" class="pause-button" aria-label="Pause exploration">Ⅱ</button>
    <div class="notice" id="notice" role="status" hidden></div>
  </main>

  <div class="transition" aria-hidden="true"><strong>Returning to the pool</strong></div>
  <script type="module">
    import('./src/mainUnderwater.js').then(({ startUnderwater }) => startUnderwater()).catch((error) => {
      console.error(error);
      document.getElementById('load-state').textContent = error.message.startsWith('WebGL')
        ? error.message : 'Ocean could not load. Open this page from a local HTTP server and check the Three.js CDN connection.';
    });
  </script>
</body>
</html>
